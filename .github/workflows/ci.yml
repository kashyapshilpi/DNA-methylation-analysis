name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  stub:
    name: Pipeline structure (stub run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
      - name: Stub run on test samplesheet
        run: nextflow run . -profile test -stub --outdir results

  test:
    name: End-to-end test (conda)
    needs: stub
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge,bioconda
          conda-remove-defaults: true
          auto-activate-base: true
          activate-environment: ''
      - name: Run pipeline on public bisulfite-seq test data
        run: nextflow run . -profile test,conda --outdir results
      - name: Check expected outputs
        run: |
          test -s results/bismark_extract/CTRL_1.deduplicated.bismark.cov.gz
          test -s results/methylkit/CpG_all_tested.tsv
          test -s results/bismark_align/CTRL_1_SE_report.txt
          test -s results/multiqc/multiqc_report.html
          head -5 results/methylkit/CpG_all_tested.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            results/methylkit
            results/multiqc/multiqc_report.html
            results/pipeline_info
            .nextflow.log
